<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Group Travel Expense Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Split the Trip</h1>
            <p>Keep friendships, share expenses.</p>
        </header>

        <main class="calculator-card">
            <div class="input-group">
                <label for="totalCost">Total Trip Cost</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="number" id="totalCost" placeholder="0.00" inputmode="decimal" min="0" step="0.01">
                </div>
            </div>

            <div class="input-group">
                <label for="travelers">Number of Travelers</label>
                <input type="number" id="travelers" placeholder="0" inputmode="numeric" min="1" step="1">
            </div>

            <div class="results-section">
                <h2>Cost per person</h2>
                <div class="amount" id="perPersonAmount">₹0.00</div>
            </div>

            <button id="copyBtn" class="primary-btn" disabled>
                Copy Breakdown
            </button>
        </main>

        <footer>
            <div class="support-section">
                <p>Support the Developer ☕</p>
                <!-- Replace 'qr-placeholder.png' with your actual UPI QR code image path -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=yourname@upi&pn=YourName" alt="UPI QR Code" class="qr-code">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
