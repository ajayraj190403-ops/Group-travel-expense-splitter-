<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Group Travel Planner & Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Trip Hub</h1>
            <p>Plan, split, and settle up seamlessly.</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-target="tab-group">Settle</button>
            <button class="tab-btn" data-target="tab-itinerary">Itinerary</button>
            <button class="tab-btn" data-target="tab-more">More</button>
        </nav>

        <!-- TAB 1: Group & Settlements -->
        <main id="tab-group" class="app-card tab-content active">
            <div class="tab-header">
                <h2>Travelers</h2>
            </div>
            <div class="action-row">
                <input type="text" id="newPersonName" placeholder="Enter name..." class="text-input">
                <button id="addPersonBtn" class="secondary-btn">+ Add</button>
            </div>
            
            <div id="peopleList" class="list-container"></div>

            <div class="results-section">
                <h2>Who Owes Whom</h2>
                <div id="settlementsList" class="settlements-container">
                    <p class="empty-state">Add people and expenses to see settlements.</p>
                </div>
            </div>

            <button id="copyBtn" class="primary-btn" disabled>
                Copy Settlement to WhatsApp
            </button>
        </main>

        <!-- TAB 2: Itinerary & Itemized Costs (Unequal Splits) -->
        <main id="tab-itinerary" class="app-card tab-content">
            <div class="tab-header">
                <h2>Add Event / Expense</h2>
            </div>
            
            <div class="expense-form">
                <input type="text" id="eventName" placeholder="Event (e.g. Scuba Diving)" class="text-input">
                
                <div class="input-wrapper">
                    <span class="currency-display">₹</span>
                    <input type="number" id="eventCost" placeholder="0.00" inputmode="decimal" min="0">
                </div>

                <div class="form-group" id="paidByGroup" style="display: none;">
                    <label>Who Paid?</label>
                    <select id="paidBySelect" class="text-input"></select>
                </div>

                <div class="form-group" id="splitAmongGroup" style="display: none;">
                    <label>Split Among (Unequal Splits):</label>
                    <div id="splitCheckboxes" class="pill-group"></div>
                </div>

                <button id="addEventBtn" class="primary-btn">Save to Itinerary</button>
            </div>

            <div class="tab-header" style="margin-top: 1rem;">
                <h2>Timeline</h2>
            </div>
            <div class="timeline-container" id="timelineList"></div>
        </main>

        <!-- TAB 3: Settings & Vote -->
        <main id="tab-more" class="app-card tab-content">
            <div class="tab-header">
                <h2>Settings</h2>
            </div>
            
            <div class="settings-group">
                <label for="currencySelect">Currency</label>
                <select id="currencySelect" class="text-input">
                    <option value="₹">₹ INR</option>
                    <option value="$">$ USD</option>
                    <option value="€">€ EUR</option>
                    <option value="£">£ GBP</option>
                </select>
            </div>

            <div class="settings-group checkbox-group">
                <input type="checkbox" id="roundToggle">
                <label for="roundToggle">Round settlements to nearest whole number</label>
            </div>

            <hr class="divider">

            <div class="tab-header">
                <h2>Vote & Veto</h2>
            </div>
            <div class="action-row">
                <input type="text" id="newIdeaInput" placeholder="Suggest an activity..." class="text-input">
                <button id="addIdeaBtn" class="secondary-btn">Propose</button>
            </div>
            <div class="ideas-container" id="ideasList"></div>
        </main>

        <footer>
            <div class="support-section">
                <p><strong>Developed by Ajayraj</strong></p>
                <p class="sub-text">Travel Agency Web Solutions | App Support: 8302945799</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=yourname@upi&pn=Support" alt="Support QR Code" class="qr-code">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
